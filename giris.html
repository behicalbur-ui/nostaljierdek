<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap / Üye Ol - Nostalji Erdek</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 400px; margin: 80px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .auth-container input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .auth-btn { width: 100%; padding: 12px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .google-btn { background: #db4437; }
        .toggle-text { margin-top: 15px; font-size: 0.9rem; color: #666; cursor: pointer; }
    </style>
</head>
<body class="arsiv-body">
    <div class="auth-container">
        <h2 id="authTitle">Giriş Yap</h2>
        <input type="email" id="email" placeholder="E-posta adresiniz">
        <input type="password" id="password" placeholder="Şifreniz">
        <button class="auth-btn" id="emailAuthBtn">Giriş Yap</button>
        <button class="auth-btn google-btn" id="googleBtn">Google ile Giriş Yap</button>
        <p class="toggle-text" id="toggleMode">Hesabın yok mu? Üye ol</p>
        <a href="arsiv.html" class="back-link" style="display:block; margin-top:20px;">← Arşife Geri Dön</a>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
