<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli - Erdek Nostalji</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrapper { max-width: 800px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hidden-admin { display: none; } /* Yetki kontrol edilene kadar paneli gizle */
    </style>
</head>
<body class="arsiv-body">

    <!-- Yetkisiz Giriş Uyarısı / Yükleniyor Alanı -->
    <div id="authCheckScreen" style="text-align: center; margin-top: 100px;">
        <h2>Yetki kontrol ediliyor, lütfen bekleyin...</h2>
    </div>

    <!-- Asıl Yönetim Paneli (Başlangıçta Gizli) -->
    <div class="admin-wrapper hidden-admin" id="adminPanelContent">
        <h1>Nostalji Erdek - Yönetim Paneli</h1>
        <p><a href="arsiv.html">← Arşife Geri Dön</a></p>
        
        <div class="form-group" style="margin-top: 20px;">
            <label>Fotoğraflar (Birden fazla seçebilirsin):</label>
            <input type="file" id="imageFiles" accept="image/*" multiple>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>Açıklama / Tarih Bilgisi:</label>
            <textarea id="imageDesc" placeholder="Fotoğraf açıklamasını girin..." rows="3" style="width:100%; padding:10px;"></textarea>
        </div>

        <button id="uploadBtn" style="background:#003366; color:white; border:none; padding:12px 20px; border-radius:4px; cursor:pointer; margin-top:10px; width:100%;">Yükle ve Arşive Gönder</button>
        <p id="statusMessage" style="margin-top: 10px; font-weight: bold; color: green;"></p>

        <hr style="margin: 40px 0;">

        <h2>Arşivdeki Gönderileri Yönet</h2>
        <div id="adminPostList" style="max-height: 400px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 4px;">
            <p>Gönderiler yükleniyor...</p>
        </div>
    </div>

    <!-- Admin Kontrollerini Yürüten Script -->
    <script type="module" src="admin.js"></script>
</body>
</html>
